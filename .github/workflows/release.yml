# 发布流水线：仅手动触发（workflow_dispatch），tag 必须先存在于仓库。
# environment: release 配置required reviewers 后即为人工审批闸门。
# 签名顺序约束（ADR-107）：将来接入 Authenticode 时，签名步骤必须位于
# vpk pack（生成 releases.win.json）之前。
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已存在 tag（如 1.2.0）"
        required: true
        type: string

permissions:
  contents: write  # 创建/发布 Release

jobs:
  release:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
      - name: verify tag exists and matches version files
        shell: pwsh
        run: |
          git fetch --tags origin
          git rev-parse "refs/tags/${{ inputs.tag }}" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "tag ${{ inputs.tag }} does not exist" }
          powershell -ExecutionPolicy Bypass -File .\scripts\check-version.ps1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # ADR-113：发布构建用 MSVC（WebView2 静态链接、免随包 DLL）+ /Brepro 确定性输出，
      # 照抄 Halcyon：不显式指定 target，主机默认 = MSVC。
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable
        with:
          components: rustfmt, clippy
      - name: Velopack CLI (vpk)
        run: dotnet tool install --global vpk
      - name: full local gate
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\check.ps1 -SkipCoverage
          # 覆盖率门禁由 build.yml 在同一提交上完成（ADR-113：MSVC 下 llvm-cov 照常使用）
      - name: build + publish Velopack release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-velopack.ps1 -Upload -Publish
      # ADR-113 风险 2 显形防线：构建后断言产物不依赖 WebView2Loader.dll
      # （脚本内已有同款断言，此处为 CI 层独立重复，失败即显形）。
      - name: assert no WebView2Loader.dll dependency
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\verify-no-webview2loader-dependency.ps1 -ExePath target\release-package\release\pandock.exe
      - name: attach sha256 sidecars
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/velopack/*.sha256 --repo weyham/pandock --clobber
